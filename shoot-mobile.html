<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>投石挑戰控制器</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
<section id="smJoin" class="glass mobile-card">
  <div class="muted">ROOM <strong id="smRoom"></strong></div>
  <h1>🎯 投石挑戰</h1>
  <label>你的名字<input id="smName" maxlength="12" placeholder="例如：若瑩"></label>
  <button id="smJoinBtn" class="primary full">加入遊戲</button>
  <div id="smMsg" class="status"></div>
</section>

<section id="smWait" class="glass mobile-card hidden">
  <div class="big-icon">🪨</div><h1>加入成功</h1><h2 id="smWelcome"></h2>
  <p class="muted">等待主持人開始。</p>
</section>

<section id="smPlay" class="glass mobile-card hidden">
  <div id="smTimer" class="mobile-timer">⏱ 45.0 秒</div>
  <h2>傾斜手機瞄準</h2>
  <div class="shoot-phone-pad">
    <div class="shoot-phone-cross" id="smCross">✚</div>
  </div>
  <div class="shoot-phone-coord">準星：<span id="smCoord">50%, 50%</span></div>
  <button id="smMotionBtn" class="secondary full">📱 啟用動作控制</button>
  <button id="smFireBtn" class="shoot-fire-btn">🪨 投石！</button>
  <div class="shoot-fallback-grid">
    <button data-dir="up">↑</button>
    <button data-dir="left">←</button>
    <button data-dir="center">●</button>
    <button data-dir="right">→</button>
    <button data-dir="down">↓</button>
  </div>
  <div id="smScore" class="notice">分數：0</div>
  <div id="smHitMsg" class="status">看大螢幕瞄準目標</div>
</section>

<section id="smEnd" class="glass mobile-card hidden">
  <div class="big-icon">🏁</div><h1>遊戲結束</h1><div id="smFinal" class="notice"></div>
</section>
</main>
<script type="module" src="./shoot-mobile.js"></script>
</body></html>
