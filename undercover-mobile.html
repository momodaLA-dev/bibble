<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>誰是臥底</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
<section id="umJoin" class="glass mobile-card">
  <div class="muted">ROOM <strong id="umRoom"></strong></div>
  <h1>🕵️ 誰是臥底</h1>
  <label>你的名字<input id="umName" maxlength="12" placeholder="例如：若瑩"></label>
  <button id="umJoinBtn" class="primary full">加入遊戲</button>
  <div id="umMsg" class="status"></div>
</section>

<section id="umWait" class="glass mobile-card hidden">
  <div class="big-icon">🤫</div><h1>加入成功</h1><h2 id="umWelcome"></h2>
  <p class="muted">等待主持人開始。</p>
</section>

<section id="umSecret" class="glass mobile-card hidden">
  <div class="eyebrow">你的秘密詞</div>
  <div class="uc-secret-card">
    <div id="umCategory" class="muted"></div>
    <strong id="umWord">？？？</strong>
  </div>
  <p class="notice">請記住這個詞，不要給別人看。輪到你時描述它，但不要直接說出答案。</p>
  <div id="umOrderHint" class="status"></div>
</section>

<section id="umVote" class="glass mobile-card hidden">
  <div class="eyebrow">手機投票</div>
  <h1>誰最像臥底？</h1>
  <div id="umVoteButtons" class="uc-mobile-votes"></div>
  <div id="umVoteMsg" class="status">每人只能投一次。</div>
</section>

<section id="umEnd" class="glass mobile-card hidden">
  <div id="umEndIcon" class="big-icon">🎭</div>
  <h1 id="umEndTitle">本局結束</h1>
  <div id="umEndDetail" class="notice"></div>
</section>
</main>
<script type="module" src="./undercover-mobile.js"></script>
</body></html>
