<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111f"><title>加入聖經問答</title><link rel="stylesheet" href="./assets/styles.css"></head><body>
<main class="app">
<section id="join" class="glass mobile-card"><div class="muted">ROOM <strong id="roomLabel"></strong></div><h1>📖 加入聖經問答</h1><div id="modeHint" class="notice">讀取房間資訊中…</div><label>你的名字<input id="nameInput" maxlength="12" placeholder="例如：若瑩"></label><div id="teamPicker" class="team-picker hidden"><div class="muted">選擇隊伍</div><div class="mobile-choice-grid"><button id="pickA" class="secondary team-pick" data-team="A">A隊</button><button id="pickB" class="secondary team-pick" data-team="B">B隊</button></div></div><div id="joinMsg" class="muted"></div><button id="joinBtn" class="primary full">加入遊戲</button></section>
<section id="waiting" class="glass mobile-card hidden"><div class="big-icon">🎈</div><h1>加入成功</h1><h2 id="welcome"></h2><p id="myTeam" class="team-tag hidden"></p><p id="waitText" class="muted">等待主持人開始。</p></section>
<section id="vote" class="mobile-card hidden"><div class="glass"><div id="mobileProgress" class="muted"></div><div id="mobileTimer" class="mobile-timer">⏱ 30 秒</div><h2 id="mobileQuestion"></h2><div class="mobile-choice-grid"><button id="voteA" class="mobile-choice choice-a">A</button><button id="voteB" class="mobile-choice choice-b">B</button><button id="voteC" class="mobile-choice choice-c">C</button><button id="voteD" class="mobile-choice choice-d">D</button></div><div id="voteMsg" class="status">請選擇答案</div><div id="mobileReference" class="scripture-ref hidden"></div></div></section>
<section id="end" class="glass mobile-card hidden"><div class="big-icon">🏆</div><h1>遊戲結束</h1><h2 id="myScore"></h2><p id="teamResult" class="team-tag hidden"></p><p class="muted">請看大螢幕最終排行榜。</p></section></main><script type="module" src="./assets/mobile.js"></script></body></html>
